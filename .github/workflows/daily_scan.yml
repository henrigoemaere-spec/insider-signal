name: Daily Insider Scan

on:
  schedule:
    # Draait elke dag om 18:00 UTC = 20:00 Belgische tijd (zomertijd)
    # In wintertijd is dit 19:00 Belgische tijd
    - cron: '0 18 * * *'
  workflow_dispatch:  # Handmatig starten via GitHub

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run insider scanner
        run: |
          python insider_scanner.py fast 3

      - name: Generate Substack post
        run: |
          python substack_generator.py 50 8

      - name: Commit and push database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add insider.db data/insider.db 2>/dev/null || true
          git add "substack_post_*.md" 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: daily scan $(date +'%Y-%m-%d')"
          git push
